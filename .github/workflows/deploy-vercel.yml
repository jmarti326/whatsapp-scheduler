name: Deploy to Vercel

# Manual production deployment. Uses Vercel's REST API so a least-privilege
# project-scoped token works without the Vercel CLI's `vercel pull` limitation.
on:
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────────────────────
# RECOMMENDED SETUP (no workflow needed):
#   1. Go to vercel.com → your project → Settings → Git
#   2. Connect your GitHub repo (jmarti326/whatsapp-scheduler)
#   3. Set "Production Branch" to master
#   4. In Settings → Environment Variables, add:
#        DATABASE_URL = your Neon connection string
#        SESSION_SECRET = your session secret
#   5. Vercel auto-deploys on every push to master. Done!
#
# ALTERNATIVE (this workflow):
#   If you want GitHub Actions instead of Vercel's built-in Git integration,
#   save a token scoped to the same project that owns the public production
#   domain as VERCEL_TOKEN, then dispatch this workflow.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          WORKER_TRIGGER_SECRET: ${{ secrets.WORKER_TRIGGER_SECRET }}
        run: |
          PAYLOAD=$(jq -n \
            --argjson repoId "${{ github.repository_id }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg sha "${{ github.sha }}" \
            '{
              name: "ipr-church-scheduler",
              target: "production",
              gitSource: {
                type: "github",
                repoId: $repoId,
                ref: $ref,
                sha: $sha
              }
            }')

          HTTP_CODE=$(curl --silent --show-error \
            --output vercel-response.json \
            --write-out "%{http_code}" \
            --request POST "https://api.vercel.com/v13/deployments?forceNew=1&skipAutoDetectionConfirmation=1" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")
          RESPONSE=$(cat vercel-response.json)
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Vercel deployment request failed with HTTP $HTTP_CODE"
            jq '{error, message, code}' <<< "$RESPONSE"
            exit 1
          fi

          DEPLOYMENT_ID=$(jq -r '.id // empty' <<< "$RESPONSE")
          DEPLOYMENT_HOST=$(jq -r '.url // empty' <<< "$RESPONSE")
          TARGET_PROJECT_ID=$(jq -r '.projectId // .project.id // empty' <<< "$RESPONSE")
          if [ -z "$DEPLOYMENT_ID" ] || [ -z "$DEPLOYMENT_HOST" ] || [ -z "$TARGET_PROJECT_ID" ]; then
            echo "Vercel did not return deployment and project identifiers"
            jq '{error, message, code}' <<< "$RESPONSE"
            exit 1
          fi

          ENV_PAYLOAD=$(jq -n \
            --arg databaseUrl "$DATABASE_URL" \
            --arg sessionSecret "$SESSION_SECRET" \
            --arg workerSecret "$WORKER_TRIGGER_SECRET" \
            '[
              {
                key: "DATABASE_URL",
                value: $databaseUrl,
                type: "sensitive",
                target: ["production"]
              },
              {
                key: "SESSION_SECRET",
                value: $sessionSecret,
                type: "sensitive",
                target: ["production"]
              },
              {
                key: "WORKER_TRIGGER_SECRET",
                value: $workerSecret,
                type: "sensitive",
                target: ["production"]
              },
              {
                key: "WORKER_TRIGGER_URL",
                value: "https://team-scheduler-worker.kindplant-78d24cd8.eastus2.azurecontainerapps.io",
                type: "plain",
                target: ["production"]
              },
              {
                key: "TRUST_PROXY",
                value: "1",
                type: "plain",
                target: ["production"]
              }
            ]')

          ENV_CODE=$(curl --silent --show-error \
            --output vercel-env.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.vercel.com/v10/projects/$TARGET_PROJECT_ID/env?upsert=true" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$ENV_PAYLOAD")
          if [ "$ENV_CODE" -lt 200 ] || [ "$ENV_CODE" -ge 300 ]; then
            echo "Vercel environment update failed with HTTP $ENV_CODE"
            jq '{error, failed}' vercel-env.json
            exit 1
          fi

          # Project environment is snapshotted when a deployment is created.
          # Create the release again after upserting its production variables.
          HTTP_CODE=$(curl --silent --show-error \
            --output vercel-response.json \
            --write-out "%{http_code}" \
            --request POST "https://api.vercel.com/v13/deployments?forceNew=1&skipAutoDetectionConfirmation=1" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")
          RESPONSE=$(cat vercel-response.json)
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Vercel release deployment failed with HTTP $HTTP_CODE"
            jq '{error, message, code}' <<< "$RESPONSE"
            exit 1
          fi
          DEPLOYMENT_ID=$(jq -r '.id // empty' <<< "$RESPONSE")
          DEPLOYMENT_HOST=$(jq -r '.url // empty' <<< "$RESPONSE")
          TARGET_PROJECT_ID=$(jq -r '.projectId // .project.id // empty' <<< "$RESPONSE")

          for attempt in $(seq 1 60); do
            STATUS=$(curl --silent --show-error --fail-with-body \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID" \
              --header "Authorization: Bearer $VERCEL_TOKEN")
            STATE=$(jq -r '.readyState // empty' <<< "$STATUS")
            echo "Vercel deployment state: $STATE"
            if [ "$STATE" = "READY" ]; then
              PROMOTE_CODE=$(curl --silent --show-error \
                --output vercel-promote.json \
                --write-out "%{http_code}" \
                --request POST \
                "https://api.vercel.com/v10/projects/$TARGET_PROJECT_ID/promote/$DEPLOYMENT_ID" \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                --header "Content-Type: application/json")
              ALREADY_CURRENT=$(jq -r '.error.message // empty' vercel-promote.json)
              if { [ "$PROMOTE_CODE" -lt 200 ] || [ "$PROMOTE_CODE" -ge 300 ]; } &&
                 [[ "$ALREADY_CURRENT" != *"already the current production deployment"* ]]; then
                echo "Vercel promotion failed with HTTP $PROMOTE_CODE"
                jq '{error, message, code}' vercel-promote.json
                exit 1
              fi

              ALIAS_CODE=$(curl --silent --show-error \
                --output vercel-alias.json \
                --write-out "%{http_code}" \
                --request POST \
                "https://api.vercel.com/v2/deployments/$DEPLOYMENT_ID/aliases" \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                --header "Content-Type: application/json" \
                --data '{"alias":"ipr-church-scheduler.vercel.app"}')
              if [ "$ALIAS_CODE" -lt 200 ] || [ "$ALIAS_CODE" -ge 300 ]; then
                echo "Vercel production alias assignment failed with HTTP $ALIAS_CODE"
                jq '{error, message, code}' vercel-alias.json
                exit 1
              fi

              URL="https://$DEPLOYMENT_HOST"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Deployed to: $URL"
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              jq '{readyState, errorCode, errorMessage}' <<< "$STATUS"
              exit 1
            fi
            sleep 5
          done

          echo "Timed out waiting for Vercel deployment"
          exit 1

      - name: Verify deployment
        if: steps.deploy.outputs.url != ''
        run: |
          for attempt in $(seq 1 30); do
            RESPONSE=$(curl --silent --show-error \
              --write-out "\n%{http_code}" \
              "https://ipr-church-scheduler.vercel.app/health")
            STATUS=$(tail -n 1 <<< "$RESPONSE")
            BODY=$(sed '$d' <<< "$RESPONSE")
            COMMIT=$(jq -r '.commit // empty' <<< "$BODY" 2>/dev/null || true)
            echo "Production health: HTTP $STATUS, commit ${COMMIT:-unknown}"
            if [ "$STATUS" = "200" ] && [ "$COMMIT" = "${{ github.sha }}" ]; then
              echo "Production portal is serving the expected commit"
              exit 0
            fi
            sleep 5
          done
          echo "Production portal did not serve commit ${{ github.sha }}"
          exit 1
