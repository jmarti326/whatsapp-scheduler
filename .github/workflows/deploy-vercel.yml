name: Deploy to Vercel

# Manual production deployment. Uses Vercel's REST API so a least-privilege
# project-scoped token works without the Vercel CLI's `vercel pull` limitation.
on:
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────────────────────
# RECOMMENDED SETUP (no workflow needed):
#   1. Go to vercel.com → your project → Settings → Git
#   2. Connect your GitHub repo (jmarti326/whatsapp-scheduler)
#   3. Set "Production Branch" to master
#   4. In Settings → Environment Variables, add:
#        DATABASE_URL = your Neon connection string
#        SESSION_SECRET = your session secret
#   5. Vercel auto-deploys on every push to master. Done!
#
# ALTERNATIVE (this workflow):
#   If you want GitHub Actions instead of Vercel's built-in Git integration,
#   create a project-scoped token, save it as VERCEL_TOKEN, and dispatch this
#   workflow. Change the trigger above to push/branches:[master] for automatic
#   deployments.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PAYLOAD=$(jq -n \
            --argjson repoId "${{ github.repository_id }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg sha "${{ github.sha }}" \
            '{
              name: "ipr-church-scheduler",
              target: "production",
              gitSource: {
                type: "github",
                repoId: $repoId,
                ref: $ref,
                sha: $sha
              }
            }')

          HTTP_CODE=$(curl --silent --show-error \
            --output vercel-response.json \
            --write-out "%{http_code}" \
            --request POST "https://api.vercel.com/v13/deployments?forceNew=1&skipAutoDetectionConfirmation=1" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")
          RESPONSE=$(cat vercel-response.json)
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Vercel deployment request failed with HTTP $HTTP_CODE"
            jq '{error, message, code}' <<< "$RESPONSE"
            exit 1
          fi

          DEPLOYMENT_ID=$(jq -r '.id // empty' <<< "$RESPONSE")
          DEPLOYMENT_HOST=$(jq -r '.url // empty' <<< "$RESPONSE")
          if [ -z "$DEPLOYMENT_ID" ] || [ -z "$DEPLOYMENT_HOST" ]; then
            echo "Vercel did not return a deployment id and URL"
            jq '{error, message, code}' <<< "$RESPONSE"
            exit 1
          fi

          for attempt in $(seq 1 60); do
            STATUS=$(curl --silent --show-error --fail-with-body \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID" \
              --header "Authorization: Bearer $VERCEL_TOKEN")
            STATE=$(jq -r '.readyState // empty' <<< "$STATUS")
            echo "Vercel deployment state: $STATE"
            if [ "$STATE" = "READY" ]; then
              URL="https://$DEPLOYMENT_HOST"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Deployed to: $URL"
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              jq '{readyState, errorCode, errorMessage}' <<< "$STATUS"
              exit 1
            fi
            sleep 5
          done

          echo "Timed out waiting for Vercel deployment"
          exit 1

      - name: Verify deployment
        if: steps.deploy.outputs.url != ''
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/login")
          echo "HTTP status: $STATUS"
          echo "✅ Deploy complete"
